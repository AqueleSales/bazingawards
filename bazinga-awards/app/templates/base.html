<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bazinga Awards{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #050508;
            background-image: radial-gradient(circle at 50% 0%, rgba(255, 215, 0, 0.05) 0%, transparent 50%), radial-gradient(circle at 50% 100%, rgba(16, 185, 129, 0.05) 0%, transparent 50%);
            background-attachment: fixed;
        }
        .font-bazinga { font-family: 'Bangers', cursive; letter-spacing: 2px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* Efeito de Carta Selecionada (GOTY Vibe) */
        .card-indicado { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
        .card-indicado:hover { transform: translateY(-5px); border-color: rgba(16, 185, 129, 0.5); background-color: rgba(255,255,255,0.05); }
        .card-selecionado { border-color: #10b981 !important; background-color: rgba(16, 185, 129, 0.1) !important; box-shadow: 0 0 20px rgba(16,185,129,0.2); transform: translateY(-5px); }
        .check-icon { opacity: 0; transition: opacity 0.2s; }
        .card-selecionado .check-icon { opacity: 1; }
    </style>
</head>
<body class="text-gray-100 min-h-screen flex flex-col">

    <nav class="w-full border-b border-white/10 bg-[#0b0b10]/80 backdrop-blur-xl sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">

            <div class="flex items-center gap-4">
                <a href="/" class="text-4xl font-bazinga text-[#FFD700] drop-shadow-[0_0_10px_rgba(255,215,0,0.4)] tracking-widest mt-1 hover:scale-105 transition-transform">BAZINGA</a>
                {% if edicao %}
                    <span class="bg-white/10 border border-white/20 text-gray-300 px-3 py-1 rounded-full text-xs font-bold tracking-widest uppercase hidden md:block">AWARDS {{ edicao.year }}</span>
                {% endif %}
            </div>

            <div class="flex items-center gap-4 md:gap-6">
                {% if user %}
                    <div class="hidden md:flex items-center gap-6 mr-2">
                        <a href="/" class="text-sm font-bold text-gray-300 hover:text-emerald-400 transition-colors">Votação</a>
                        <a href="#" class="text-sm font-bold text-gray-300 hover:text-[#FFD700] transition-colors">Histórico</a>
                    </div>

                    <div class="flex items-center gap-3 bg-white/5 border border-white/10 px-4 py-2 rounded-full cursor-pointer hover:bg-white/10 transition-colors">
                        {% if user.photo_url %}
                            <img src="{{ user.photo_url }}" class="w-8 h-8 rounded-full border border-emerald-500/50 object-cover">
                        {% else %}
                            <div class="w-8 h-8 rounded-full bg-emerald-900 border border-emerald-500/50 flex items-center justify-center font-bold text-xs">{{ user.name[0] | upper }}</div>
                        {% endif %}
                        <span class="text-sm font-medium hidden sm:block">{{ user.name }}</span>
                    </div>

                    {% if user.is_admin %}
                        <a href="{{ url_for('admin.dashboard') }}" class="text-xs font-bold uppercase tracking-widest text-[#FFD700] hover:text-white transition-colors hidden sm:block">Admin</a>
                    {% endif %}

                    <a href="{{ url_for('auth.logout') }}" class="text-xs font-bold uppercase tracking-widest text-red-400 hover:text-red-300 transition-colors">Sair</a>
                {% endif %}
            </div>

        </div>
    </nav>

    <main class="flex-1 max-w-6xl mx-auto w-full px-6 py-12">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
