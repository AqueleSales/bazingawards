{% extends "base.html" %}

{% block content %}
<style>
    body { overflow: hidden; }

    /* Canhões de Luz */
    .spot-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 0; overflow: hidden; }

    .spotlight {
        position: absolute; width: 80vw; height: 150vh; top: -20vh;
        background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 50%);
        opacity: 0; transition: all 1.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .spot-1 { left: -10vw; }
    .spot-2 { right: -10vw; }

    /* Luzes varrendo (Zigue-zague) */
    .spot-1.wandering { opacity: 1; animation: zigzag-1 7s infinite alternate ease-in-out; }
    .spot-2.wandering { opacity: 1; animation: zigzag-2 6s infinite alternate ease-in-out; }

    /* Luzes focadas no campeão (Douradas) */
    .spot-1.focus, .spot-2.focus {
        opacity: 1; animation: none; top: -15vh;
        background: radial-gradient(ellipse at top, rgba(250, 204, 21, 0.15) 0%, transparent 60%);
    }
    .spot-1.focus { left: 50%; transform: translateX(-50%) rotate(-5deg); }
    .spot-2.focus { right: 50%; transform: translateX(50%) rotate(5deg); }

    @keyframes zigzag-1 {
        0% { transform: translate(-10vw, 5vh) rotate(5deg); }
        50% { transform: translate(30vw, -5vh) rotate(-10deg); }
        100% { transform: translate(-20vw, 10vh) rotate(15deg); }
    }
    @keyframes zigzag-2 {
        0% { transform: translate(20vw, -10vh) rotate(-15deg); }
        50% { transform: translate(-30vw, 5vh) rotate(10deg); }
        100% { transform: translate(10vw, -5vh) rotate(-5deg); }
    }

    /* Linha do Tempo da Cerimônia */
    .ceremony-timeline {
        position: absolute; top: 2rem; left: 50%; transform: translateX(-50%);
        display: flex; gap: 0.8rem; z-index: 50; background: rgba(0,0,0,0.5);
        padding: 0.5rem 1.5rem; border-radius: 2rem; border: 1px solid rgba(255,255,255,0.1);
        backdrop-filter: blur(5px);
    }
    .c-dot {
        width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,0.2);
        cursor: pointer; transition: all 0.3s;
    }
    .c-dot:hover { background: rgba(255,255,255,0.5); transform: scale(1.2); }
    .c-dot.active { background: #facc15; box-shadow: 0 0 10px rgba(250,204,21,0.5); transform: scale(1.3); }

    /* Textos */
    .ceremony-container { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 90vh; width: 100%; max-width: 1000px; margin: 0 auto; }
    .c-title { font-family: 'Fraunces', serif; font-size: 3.5rem; color: #fff; margin-bottom: 0.5rem; text-align: center; opacity: 0; transform: translateY(20px); transition: all 1s ease; }
    .c-desc { font-family: 'Inter', sans-serif; color: rgba(255, 255, 255, 0.6); font-size: 1.2rem; text-align: center; opacity: 0; transform: translateY(20px); transition: all 1s ease; }
    .visible { opacity: 1; transform: translateY(0); }

    /* Pódio Fixo e Centralizado (Fim do tortinho) */
    .podium-area { display: flex; align-items: flex-end; justify-content: center; gap: 2rem; height: 350px; width: 100%; margin-top: 4rem; }
    .podium-col { width: 140px; min-width: 140px; display: flex; flex-direction: column; align-items: center; }

    .podium-slot { display: flex; flex-direction: column; align-items: center; opacity: 0; transform: translateY(40px); transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1); width: 100%; }
    .podium-slot.show { opacity: 1; transform: translateY(0); }

    .col-center { margin-bottom: 60px; z-index: 10; } /* 1º Lugar sempre mais alto */
    .col-center.show { transform: translateY(0) scale(1.15); }

    /* Avatares e Cartões */
    .podium-avatar { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', serif; font-size: 2.5rem; color: #fff; border: 4px solid transparent; margin-bottom: 1rem; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .border-gold { border-color: #facc15; box-shadow: 0 0 40px rgba(250, 204, 21, 0.4); }
    .border-silver { border-color: #9ca3af; }
    .border-bronze { border-color: #b45309; }
    .podium-name { font-family: 'Inter', sans-serif; color: #fff; font-weight: 600; font-size: 1.1rem; text-align: center; width: 100%; word-wrap: break-word; }
    .podium-votes { font-family: 'JetBrains Mono', monospace; color: rgba(255,255,255,0.4); font-size: 0.8rem; margin-top: 0.2rem; }

    /* O Troféu */
    .trophy-icon { margin-bottom: -15px; z-index: 20; opacity: 0; transform: scale(0); transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .col-center.show .trophy-icon { opacity: 1; transform: scale(1); }

    /* Botão de Avançar e Ações */
    .ceremony-actions { margin-top: 4rem; display: flex; gap: 1rem; opacity: 0; pointer-events: none; transition: opacity 1s; }
    .ceremony-actions.ready { opacity: 1; pointer-events: auto; }
</style>

<div class="stage">
    <div class="curtain curtain-left"></div>
    <div class="curtain curtain-right"></div>

    <div class="spot-container">
        <div class="spotlight spot-1" id="luz-1"></div>
        <div class="spotlight spot-2" id="luz-2"></div>
    </div>

    <div class="ceremony-timeline" id="timeline">
        {% for cat in ranking %}
            <div class="c-dot" id="dot-{{ loop.index0 }}" title="{{ cat.nome }}" onclick="pularParaCategoria({{ loop.index0 }})"></div>
        {% endfor %}
    </div>

    <div class="ceremony-container">
        <div id="c-title" class="c-title"></div>
        <div id="c-desc" class="c-desc"></div>

        <div class="podium-area">
            <div class="podium-col" id="col-2"></div>
            <div class="podium-col col-center" id="col-1"></div>
            <div class="podium-col" id="col-3"></div>
        </div>

        <div id="actions" class="ceremony-actions">
            <button class="btn btn-ghost" onclick="window.location.href='/'">Sair</button>
            <button class="btn" style="background-color: #facc15; color: #000;" id="btn-next" onclick="avancarCategoria()">Próxima Categoria</button>
        </div>
    </div>
</div>

<script>
    const rankingData = {{ ranking | tojson }};
    let stepAtual = {{ step_atual }};

    // Se ele já tinha terminado e clicou em "Iniciar Cerimônia" de novo, recomeça do zero.
    if (stepAtual >= rankingData.length) {
        stepAtual = 0;
    }

    function atualizarTimeline() {
        document.querySelectorAll('.c-dot').forEach((dot, index) => {
            dot.classList.toggle('active', index === stepAtual);
        });
    }

    function pularParaCategoria(index) {
        stepAtual = index;
        iniciarCerimonia();
    }

    function iniciarCerimonia() {
        if (stepAtual >= rankingData.length) {
            finalizarCerimonia();
            return;
        }

        const cat = rankingData[stepAtual];
        const luz1 = document.getElementById('luz-1');
        const luz2 = document.getElementById('luz-2');
        const title = document.getElementById('c-title');
        const desc = document.getElementById('c-desc');
        const actions = document.getElementById('actions');

        // Limpa as colunas físicas do pódio
        document.getElementById('col-1').innerHTML = '';
        document.getElementById('col-1').className = 'podium-col col-center'; // reseta classes
        document.getElementById('col-2').innerHTML = '';
        document.getElementById('col-3').innerHTML = '';

        // Reseta o palco para a nova categoria
        luz1.className = 'spotlight spot-1'; // apaga luzes
        luz2.className = 'spotlight spot-2';
        title.classList.remove('visible');
        desc.classList.remove('visible');
        actions.classList.remove('ready');

        atualizarTimeline();

        // Salva onde a pessoa está no banco de dados silenciosamente
        fetch('/cerimonia/salvar_progresso', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({step: stepAtual})
        });

        // 1. Acende luzes brancas em zigue-zague e mostra os títulos
        setTimeout(() => {
            title.textContent = cat.nome;
            desc.textContent = cat.descricao;
            title.classList.add('visible');
            desc.classList.add('visible');

            luz1.classList.add('wandering');
            luz2.classList.add('wandering');
        }, 500);

        // Se ninguém votou nessa categoria
        if (cat.podio.length === 0) {
            setTimeout(() => {
                document.getElementById('col-1').innerHTML = `<p style="color: rgba(255,255,255,0.4); font-family: 'Inter'; width: 200px; text-align: center; margin-left: -30px;">Nenhum voto registrado.</p>`;
                document.getElementById('col-1').classList.add('show');
                actions.classList.add('ready');
                luz1.classList.remove('wandering'); luz2.classList.remove('wandering');
            }, 1500);
            return;
        }

        let delay = 2500;

        // Revela o 3º Lugar (Direita -> col-3)
        if (cat.podio.length >= 3) {
            setTimeout(() => { renderSlot('col-3', cat.podio[2], 'border-bronze'); }, delay);
            delay += 2500;
        }

        // Revela o 2º Lugar (Esquerda -> col-2)
        if (cat.podio.length >= 2) {
            setTimeout(() => { renderSlot('col-2', cat.podio[1], 'border-silver'); }, delay);
            delay += 3000;
        }

        // Revela o 1º Lugar (Centro -> col-1) com explosão de luzes
        if (cat.podio.length >= 1) {
            setTimeout(() => {
                renderSlot('col-1', cat.podio[0], 'border-gold', true);

                // Muda a luz de "wandering" branco para "focus" dourado no meio
                luz1.className = 'spotlight spot-1 focus';
                luz2.className = 'spotlight spot-2 focus';
            }, delay);

            setTimeout(() => {
                actions.classList.add('ready');
            }, delay + 1500);
        }
    }

    function renderSlot(colId, pessoa, colorClass, isWinner = false) {
        const col = document.getElementById(colId);

        let avatarHTML = pessoa.foto ? `<img src="${pessoa.foto}" class="podium-avatar ${colorClass}">` : `<div class="podium-avatar ${colorClass}">${pessoa.nome.charAt(0).toUpperCase()}</div>`;

        let trophyHTML = isWinner ? `
            <div class="trophy-icon">
                <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#facc15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
                    <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
                    <path d="M4 22h16"></path>
                    <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path>
                    <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path>
                    <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path>
                </svg>
            </div>` : '';

        // Injerta o HTML dentro da coluna correspondente
        col.innerHTML = `
            <div class="podium-slot">
                ${trophyHTML}
                ${avatarHTML}
                <span class="podium-name">${pessoa.nome}</span>
                <span class="podium-votes">${pessoa.votos} Voto${pessoa.votos > 1 ? 's' : ''}</span>
            </div>
        `;

        // Força a renderização do DOM antes de aplicar a classe de animação para fazer o fade de baixo para cima
        setTimeout(() => {
            col.querySelector('.podium-slot').classList.add('show');
            if(isWinner) col.classList.add('show');
        }, 50);
    }

    function avancarCategoria() {
        stepAtual++;
        iniciarCerimonia();
    }

    function finalizarCerimonia() {
        document.getElementById('timeline').style.display = 'none';
        document.getElementById('luz-1').className = 'spotlight spot-1 focus';
        document.getElementById('luz-2').className = 'spotlight spot-2 focus';
        document.querySelector('.podium-area').innerHTML = '';

        document.getElementById('c-title').textContent = 'Cerimônia Concluída';
        document.getElementById('c-desc').textContent = 'O Bazinga Awards chegou ao fim. Obrigado por participar!';

        document.getElementById('c-title').classList.add('visible');
        document.getElementById('c-desc').classList.add('visible');

        document.getElementById('actions').innerHTML = `<a class="btn btn-ghost" href="/">Voltar ao Início</a>`;
        document.getElementById('actions').classList.add('ready');
    }

    // Dá a partida assim que a tela abre
    window.onload = iniciarCerimonia;
</script>
{% endblock %}
